[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imgur-account-downloader"
version = "1.0.0"
description = "Retrieve and organize all images from an Imgur account by album with maximal metadata preservation"
readme = "README.md"
authors = [{ name = "coreyx" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pillow>=9.0.0",
    "piexif>=1.1.3",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
imgur-account-downloader = "imgur_downloader.cli:cli"
imgur-downloader = "imgur_downloader.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["imgur_downloader*"]
